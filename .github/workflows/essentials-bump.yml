# Weekly update of the build essentials that Dependabot can't track:
# the pioarduino ESP32 platform (platformio.ini) and the matching pioarduino core
# (requirements-build.txt). They must move together: the core must be the version the
# platform itself declares, or the build breaks (mismatched SCons).
#
# The update is built first and only lands on main if the firmware builds; otherwise main
# stays on the working version and the failed version is recorded in .github/essentials-hold.txt.
# Library versions (lvgl, NimBLE, ...) are pinned in platformio.ini and updated by hand.
name: Update build essentials

on:
  schedule:
    - cron: "41 4 * * 2"   # weekly: Tuesday 04:41 UTC (07:41 Riyadh), the day after Dependabot
  workflow_dispatch:

permissions:
  contents: write

env:
  HOLD: .github/essentials-hold.txt   # platform version that failed to build, if any

concurrency:
  group: writes-to-main
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Look for a newer ESP32 platform
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUR=$(sed -n 's#^platform = .*/releases/download/\([^/]*\)/platform-espressif32.zip#\1#p' platformio.ini)
          NEW=$(gh api repos/pioarduino/platform-espressif32/releases/latest --jq .tag_name)
          echo "Current platform: $CUR · latest release: $NEW"
          if [ -z "$CUR" ] || [ -z "$NEW" ] || [ "$CUR" = "$NEW" ] || [ "$(printf '%s\n%s\n' "$CUR" "$NEW" | sort -V | tail -1)" != "$NEW" ]; then
            echo "✓ Platform is current."; echo "bump=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A version that already failed is only retried once platformio.ini changes
          # (for example when the original project updates its libraries).
          KEY="$NEW@$(sha256sum platformio.ini | cut -c1-12)"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          if [ "$(cat "$HOLD" 2>/dev/null)" = "$KEY" ]; then
            echo "⏸ Platform $NEW already failed to build with the current platformio.ini; staying on $CUR."
            echo "bump=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CORE=$(curl -fsSL "https://raw.githubusercontent.com/pioarduino/platform-espressif32/$NEW/builder/penv_setup.py" \
                 | sed -n 's/.*"pioarduino": *">=\([0-9][^"]*\)".*/\1/p' | head -1)
          if [ -z "$CORE" ]; then echo "::error::Couldn't find the pioarduino core version platform $NEW needs."; exit 1; fi
          echo "Platform $NEW needs pioarduino $CORE or newer."
          # The newest pioarduino at or above that (newer releases carry dependency security fixes).
          LATEST=$(python3 -m pip index versions pioarduino 2>/dev/null | sed -n 's/^pioarduino (\(.*\))$/\1/p')
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$CORE" "$LATEST" | sort -V | tail -1)" = "$LATEST" ]; then CORE=$LATEST; fi
          echo "Using pioarduino $CORE."
          sed -i "s#/releases/download/$CUR/platform-espressif32.zip#/releases/download/$NEW/platform-espressif32.zip#" platformio.ini
          sed -i "s#^pioarduino==.*#pioarduino==$CORE#" requirements-build.txt
          git diff
          { echo "cur=$CUR"; echo "new=$NEW"; echo "core=$CORE"; echo "bump=true"; } >> "$GITHUB_OUTPUT"

      - name: Build with the new platform
        id: build
        if: steps.check.outputs.bump == 'true'
        continue-on-error: true
        uses: ./.github/actions/build-firmware

      - name: Commit to main
        if: steps.check.outputs.bump == 'true' && steps.build.outcome == 'success'
        env:
          CUR: ${{ steps.check.outputs.cur }}
          NEW: ${{ steps.check.outputs.new }}
          CORE: ${{ steps.check.outputs.core }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platformio.ini requirements-build.txt
          git commit -q -m "Update ESP32 platform $CUR → $NEW (pioarduino core $CORE)" \
                        -m "Built successfully before committing. Release notes: https://github.com/pioarduino/platform-espressif32/releases/tag/$NEW"
          git push -q origin HEAD:main || { git pull -q --rebase origin main && git push -q origin HEAD:main; }
          echo "✓ Updated; it will be in the next weekly release."

      # Record the failed version so it isn't rebuilt every week, and say why on main.
      - name: Hold the platform at the working version
        if: steps.check.outputs.bump == 'true' && steps.build.outcome != 'success'
        env:
          CUR: ${{ steps.check.outputs.cur }}
          NEW: ${{ steps.check.outputs.new }}
          CORE: ${{ steps.check.outputs.core }}
          KEY: ${{ steps.check.outputs.key }}
        run: |
          git checkout -q -- platformio.ini requirements-build.txt
          echo "$KEY" > "$HOLD"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$HOLD"
          git commit -q -m "Hold ESP32 platform at $CUR: $NEW doesn't build yet" \
            -m "Tried platform $NEW with pioarduino core $CORE; the firmware build failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -m "Retried automatically when a newer platform is released or platformio.ini changes."
          git push -q origin HEAD:main || { git pull -q --rebase origin main && git push -q origin HEAD:main; }
          {
            echo "### ⏸ ESP32 platform held at $CUR"
            echo "Platform **$NEW** (pioarduino core $CORE) doesn't build with this firmware yet, so \`main\` stays on **$CUR**."
            echo "It is retried automatically when a newer platform is released or \`platformio.ini\` changes."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::ESP32 platform $NEW doesn't build yet; staying on $CUR."
