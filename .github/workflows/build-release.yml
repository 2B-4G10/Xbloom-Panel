# Builds the firmware (with the Double Shot boot logo) on every change and, on main,
# publishes a GitHub release with the .bin files and an automatic changelog.
# Pull requests (including Dependabot's) get the build as a check, without a release.
name: Build & release firmware

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "boards/**"
      - "platformio.ini"
      - "partitions.csv"
      - "requirements-build.txt"
      - ".github/workflows/build-release.yml"
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "boards/**"
      - "platformio.ini"
      - "partitions.csv"
      - "requirements-build.txt"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:   # also started by sync-upstream.yml after merging upstream fixes

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PIO_ENV: crowpanel-advance-43

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # the ESP32 tools support 3.10–3.14
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-v2-${{ runner.os }}-py312-${{ hashFiles('platformio.ini', 'requirements-build.txt') }}
          restore-keys: pio-v2-${{ runner.os }}-py312-

      # The ESP32 platform runs a nested build with the PlatformIO Core in ~/.platformio/penv
      # (it installs the pioarduino fork there). Install that same core there first and use it
      # for the whole build, so both halves share one SCons.
      - name: Install build tools
        run: |
          python -m venv ~/.platformio/penv
          ~/.platformio/penv/bin/python -m pip install -q --upgrade pip
          ~/.platformio/penv/bin/python -m pip uninstall -y -q platformio || true
          ~/.platformio/penv/bin/python -m pip install -q -r requirements-build.txt
          ~/.platformio/penv/bin/pio --version

      - name: Build
        run: ~/.platformio/penv/bin/pio run -e "$PIO_ENV"

      - name: Collect the firmware files
        id: meta
        run: |
          VER=$(sed -n "s/.*FW_VERSION='\"\([^\"]*\)\"'.*/\1/p" platformio.ini)
          B=".pio/build/$PIO_ENV"
          mkdir dist
          # Names say how each file may be installed, to avoid mix-ups:
          cp "$B/firmware.bin"         dist/xbloom-panel-doubleshot-UPDATE-WiFi-or-USB.bin  # Wi-Fi update page (or USB at 0x10000)
          cp "$B/firmware.factory.bin" dist/xbloom-panel-doubleshot-FULL-USB-ONLY.bin       # USB only, at 0x0
          (cd dist && sha256sum ./*.bin | sed "s#\./##" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "version=${VER:-dev}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history + tags for the changelog

      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist

      - name: Write the changelog
        env:
          VER: ${{ needs.build.outputs.version }}
        run: |
          TAG="v${VER}-ds.${GITHUB_RUN_NUMBER}"
          PREV=$(git describe --tags --abbrev=0 --match 'v*-ds.*' 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE=("$PREV..HEAD"); else RANGE=(-n 30 HEAD); fi
          {
            echo "## ☕ What's new${PREV:+ since $PREV}"
            echo
            LOG=$(git log --no-merges --pretty='- %s (%h)' "${RANGE[@]}" -- . ':!CHANGELOG.md')
            echo "${LOG:-- Rebuilt with no source changes}"
            echo
            echo "## 📦 Which file do I need?"
            echo
            echo "| File | How to install it | Your settings |"
            echo "|---|---|---|"
            echo "| 🛜 \`xbloom-panel-doubleshot-UPDATE-WiFi-or-USB.bin\` | **Wi-Fi:** on the panel, **Settings → Software update**, then upload this file from your phone. (USB also works, written at address \`0x10000\`.) | ✅ Kept |"
            echo "| 🔌 \`xbloom-panel-doubleshot-FULL-USB-ONLY.bin\` | **USB cable only**, written at address \`0x0\` (first install, or to recover a panel). | ⚠️ Reset (Wi-Fi and xBloom login) |"
            echo
            echo "> ⛔ **Never upload the FULL-USB-ONLY file on the panel's Wi-Fi update page.** It is a whole-flash image for USB and won't work as a Wi-Fi update."
            echo
            echo "SHA-256:"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$TAG" dist/xbloom-panel-doubleshot-UPDATE-WiFi-or-USB.bin dist/xbloom-panel-doubleshot-FULL-USB-ONLY.bin dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "xBloom Panel $VER · Double Shot (build ${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md --latest

      - name: Add it to CHANGELOG.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q main && git pull -q --ff-only
          { echo "# Changelog"; echo; echo "## [$TAG](https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG) · $(date -u +%Y-%m-%d)"; echo;
            sed '1,2d' notes.md | sed -n '/^## 📦 Which file/q;p'; if [ -f CHANGELOG.md ]; then sed '1,2d' CHANGELOG.md; fi; } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md
          git add CHANGELOG.md
          git commit -q -m "Changelog for $TAG [skip ci]"
          git push -q origin main || echo "::warning::Couldn't push CHANGELOG.md (main moved); the release notes are complete."
