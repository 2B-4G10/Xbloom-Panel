# Firmware builds and weekly releases.
# - Pull requests (incl. Dependabot's) that touch the firmware or the build are built as a check.
# - Every Wednesday, if anything changed since the last release, the firmware is built and a
#   new release is published with the .bin files and a changelog. "Run workflow" does the
#   same on demand. (Weekly schedule: Sun upstream watch · Mon Dependabot · Tue platform check
#   · Wed release.)
name: Build & release firmware

on:
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "boards/**"
      - "platformio.ini"
      - "partitions.csv"
      - "requirements-build.txt"
      - "requirements-build-overrides.txt"
      - ".github/**"
  schedule:
    - cron: "17 18 * * 3"   # weekly: Wednesday 18:17 UTC (21:17 Riyadh), after the week's updates
  workflow_dispatch:
    inputs:
      force:
        description: Release even if nothing changed since the last release
        type: boolean
        default: false
      beta:
        description: "Beta: a pre-release, offered only to panels with Beta updates on (password)"
        type: boolean
        default: false

concurrency:
  group: firmware-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decides whether this run publishes a release (weekly/manual runs with changes only).
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      prev: ${{ steps.decide.outputs.prev }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force || inputs.beta || false }}
        run: |
          PREV=$(git tag --merged HEAD --list 'v*-ds.*' --sort=-creatordate | head -1)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != schedule ] && [ "$EVENT" != workflow_dispatch ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$FORCE" = true ] || [ -z "$PREV" ] || [ -n "$(git log --format=%h "$PREV..HEAD" -- . ':!CHANGELOG.md')" ]; then
            echo "Changes since ${PREV:-the beginning}: releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing changed since $PREV: no release this week."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: github.event_name == 'pull_request' || needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.fw.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # Releases are numbered 4.20.XXX: only XXX goes up, by one per release (4.20.001, 4.20.002, ...).
      - name: Set the version (4.20.XXX)
        if: needs.check.outputs.release == 'true'
        env:
          PREV: ${{ needs.check.outputs.prev }}
        run: |
          N=$(echo "$PREV" | sed -n 's/^v4\.20\.\([0-9]\+\)-ds\..*/\1/p')
          V=$(printf '4.20.%03d' $((10#${N:-0} + 1)))
          sed -i "s/-DFW_VERSION='\"[^\"]*\"'/-DFW_VERSION='\"$V\"'/" platformio.ini
          grep FW_VERSION platformio.ini
          echo "This release is $V (previous: ${PREV:-none})"
      - id: fw
        uses: ./.github/actions/build-firmware
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: dist/
          if-no-files-found: error

  release:
    needs: [check, build]
    if: needs.check.outputs.release == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history + tags for the changelog

      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist

      - name: Write the changelog
        env:
          VER: ${{ needs.build.outputs.version }}
          PREV: ${{ needs.check.outputs.prev }}
          BETA: ${{ inputs.beta || false }}
        run: |
          TAG="v${VER}-ds.${GITHUB_RUN_NUMBER}"
          if [ -n "$PREV" ]; then RANGE=("$PREV..HEAD"); else RANGE=(-n 30 HEAD); fi
          {
            # Hand-written notes in .github/release-notes.md when there are any (kept
            # friendly: emoji headings, what changed for the person at the panel);
            # otherwise the list of changes.
            NOTES=$(sed '/^<!--/,/-->/d' .github/release-notes.md 2>/dev/null | sed '/./,$!d')
            if [ "$BETA" = true ]; then echo "> [!WARNING]"; echo "> 🧪 **Beta.** Offered only to panels with **Beta updates** on. It may have rough edges."; echo; fi
            echo "## ☕ What's new in $VER"
            echo
            if [ -n "$NOTES" ]; then
              echo "$NOTES"
            else
              LOG=$(git log --no-merges --pretty='- %s' "${RANGE[@]}" -- . ':!CHANGELOG.md' ':!.github/release-notes.md')
              echo "${LOG:-- Rebuilt with no source changes}"
            fi
            echo
            echo "---"
            echo
            echo "## 📦 Which file do I need?"
            echo
            echo "| File | How to install it | Your settings |"
            echo "|---|---|---|"
            echo "| 🛜 \`xbloom-panel-doubleshot-UPDATE-WiFi-or-USB.bin\` | **Wi-Fi:** on the panel, **Settings → Software update**, then upload this file from your phone. (USB also works, written at address \`0x10000\`.) | ✅ Kept |"
            echo "| 🔌 \`xbloom-panel-doubleshot-FULL-USB-ONLY.bin\` | **USB cable only**, written at address \`0x0\` (first install, or to recover a panel). | ⚠️ Reset (Wi-Fi and xBloom login) |"
            echo
            echo "> ⛔ **Never upload the FULL-USB-ONLY file on the panel's Wi-Fi update page.** It is a whole-flash image for USB and won't work as a Wi-Fi update."
            echo
            echo "SHA-256:"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VER=$VER" >> "$GITHUB_ENV"
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.build.outputs.version }}
          BETA: ${{ inputs.beta || false }}
        run: |
          # A beta is a pre-release: /releases/latest (what every other panel follows) skips it.
          if [ "$BETA" = true ]; then KIND=(--prerelease); TITLE="xBloom Panel $VER beta · Double Shot (build ${GITHUB_RUN_NUMBER})"
          else KIND=(--latest); TITLE="xBloom Panel $VER · Double Shot (build ${GITHUB_RUN_NUMBER})"; fi
          gh release create "$TAG" dist/xbloom-panel-doubleshot-UPDATE-WiFi-or-USB.bin dist/xbloom-panel-doubleshot-FULL-USB-ONLY.bin dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md "${KIND[@]}"

      # A beta keeps the notes for the real release, and stays out of the changelog.
      - name: Add it to CHANGELOG.md
        if: ${{ !inputs.beta }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q main && git pull -q --ff-only
          # New entry under the intro (the first 4 lines), the notes without the file table.
          { head -n 4 CHANGELOG.md
            echo "## ☕ [$VER · build ${GITHUB_RUN_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG) · $(date -u +%Y-%m-%d)"; echo
            sed '1,2d' notes.md | sed -n '/^## 📦 Which file/q;p' | sed '/^---$/d'
            tail -n +5 CHANGELOG.md; } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md
          # Keep this release's notes (.github/release-notes/<tag>.md), then start the next ones empty.
          mkdir -p .github/release-notes
          sed -n '/^## 📦 Which file/q;p' notes.md | sed '/^---$/d' > ".github/release-notes/$TAG.md"
          git show HEAD:.github/release-notes.md 2>/dev/null | sed -n '/^<!--/,/-->/p' > .github/release-notes.md || true
          git add CHANGELOG.md .github/release-notes.md .github/release-notes
          git commit -q -m "Changelog for $TAG [skip ci]"
          git push -q origin main || echo "::warning::Couldn't push CHANGELOG.md (main moved); the release notes are complete."
