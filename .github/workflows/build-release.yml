# Builds the firmware (with the Double Shot boot logo) on every change and, on main,
# publishes a GitHub release with the .bin files and an automatic changelog.
# Pull requests (including Dependabot's) get the build as a check, without a release.
name: Build & release firmware

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "boards/**"
      - "platformio.ini"
      - "partitions.csv"
      - "requirements-build.txt"
      - ".github/workflows/build-release.yml"
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "boards/**"
      - "platformio.ini"
      - "partitions.csv"
      - "requirements-build.txt"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:   # also started by sync-upstream.yml after merging upstream fixes

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PIO_ENV: crowpanel-advance-43

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # the ESP32 tools support 3.10–3.14
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'requirements-build.txt') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install build tools
        run: pip install -r requirements-build.txt

      - name: Build
        run: pio run -e "$PIO_ENV"

      - name: Collect the firmware files
        id: meta
        run: |
          VER=$(sed -n "s/.*FW_VERSION='\"\([^\"]*\)\"'.*/\1/p" platformio.ini)
          B=".pio/build/$PIO_ENV"
          mkdir dist
          cp "$B/firmware.bin"         dist/xbloom-panel-doubleshot-update.bin   # Wi-Fi update page
          cp "$B/firmware.factory.bin" dist/xbloom-panel-doubleshot-full.bin     # USB, address 0x0
          (cd dist && sha256sum ./*.bin | sed "s#\./##" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "version=${VER:-dev}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags for the changelog

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - name: Write the changelog
        env:
          VER: ${{ needs.build.outputs.version }}
        run: |
          TAG="v${VER}-ds.${GITHUB_RUN_NUMBER}"
          PREV=$(git describe --tags --abbrev=0 --match 'v*-ds.*' 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE=("$PREV..HEAD"); else RANGE=(-n 30 HEAD); fi
          {
            echo "## ☕ What's new${PREV:+ since $PREV}"
            echo
            LOG=$(git log --no-merges --pretty='- %s (%h)' "${RANGE[@]}" -- . ':!CHANGELOG.md')
            echo "${LOG:-- Rebuilt with no source changes}"
            echo
            echo "## 📦 Files"
            echo "| File | Use it for |"
            echo "|---|---|"
            echo "| \`xbloom-panel-doubleshot-update.bin\` | Panel **Settings → Software update** over Wi-Fi (keeps your settings) |"
            echo "| \`xbloom-panel-doubleshot-full.bin\` | First install over USB, written at address \`0x0\` |"
            echo
            echo "SHA-256:"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$TAG" dist/xbloom-panel-doubleshot-update.bin dist/xbloom-panel-doubleshot-full.bin dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "xBloom Panel $VER · Double Shot (build ${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md --latest

      - name: Add it to CHANGELOG.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q main && git pull -q --ff-only
          { echo "# Changelog"; echo; echo "## [$TAG](https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG) · $(date -u +%Y-%m-%d)"; echo;
            sed '1,2d' notes.md | sed -n '/^## 📦 Files/q;p'; if [ -f CHANGELOG.md ]; then sed '1,2d' CHANGELOG.md; fi; } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md
          git add CHANGELOG.md
          git commit -q -m "Changelog for $TAG [skip ci]"
          git push -q origin main || echo "::warning::Couldn't push CHANGELOG.md (main moved); the release notes are complete."
