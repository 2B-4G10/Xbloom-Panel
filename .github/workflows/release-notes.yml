# Puts .github/release-notes.md on an existing release page as its "What's new"
# (the file table and checksums stay), then empties the file. For when a release
# went out before its notes were written.
name: Release notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v4.1.0-ds.17
        required: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update the release page
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          NOTES=$(sed '/^<!--/,/-->/d' .github/release-notes.md | sed '/./,$!d')
          [ -n "$NOTES" ] || { echo "::error::.github/release-notes.md is empty"; exit 1; }
          VER=$(echo "$TAG" | sed 's/^v//; s/-ds\..*//')
          gh release view "$TAG" --json body --jq .body > old.md
          { echo "## ☕ What's new in $VER"; echo; echo "$NOTES"; echo
            sed -n '/^## 📦 Which file/,$p' old.md; } > new.md
          gh release edit "$TAG" --notes-file new.md
          cat new.md
      - name: Start the next notes empty
        run: |
          sed -n '/^<!--/,/-->/p' .github/release-notes.md > notes.tmp && mv notes.tmp .github/release-notes.md
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-notes.md
          git diff --cached --quiet || { git commit -q -m "Release notes used for ${{ inputs.tag }} [skip ci]"; git push -q; }
