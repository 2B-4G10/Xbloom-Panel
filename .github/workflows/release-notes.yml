# Puts the hand-written notes in .github/release-notes/<tag>.md on that release's
# page as its "What's new" (the file table and checksums stay). Tag "all" updates
# every release that has a notes file.
name: Release notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v4.1.0-ds.17), or "all"
        required: true
        default: all

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update the release pages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$TAG" = all ]; then FILES=$(ls .github/release-notes/*.md); else FILES=".github/release-notes/$TAG.md"; fi
          for f in $FILES; do
            t=$(basename "$f" .md)
            gh release view "$t" --json body --jq .body > old.md || { echo "::warning::no release $t"; continue; }
            { cat "$f"; echo; echo "---"; echo; sed -n '/^## 📦/,$p' old.md; } > new.md
            gh release edit "$t" --notes-file new.md
            echo "updated $t"
          done
