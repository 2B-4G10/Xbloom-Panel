# Runs the README's one-command installers, exactly as written there, on fresh
# Windows and Mac machines, twice: the normal way (download the firmware and esptool,
# check them; no panel is plugged in, so XBP_DOWNLOAD_ONLY stops there) and the
# build-from-source way (XBP_BUILD=1, stopping after the build with XBP_BUILD_ONLY).
name: Installer test

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/**"
      - "platformio.ini"
      - "requirements-build.txt"
      - ".github/workflows/installers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      XBP_BUILD_ONLY: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          path: readme
          sparse-checkout: README.md
      - name: Run the README's Windows command
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force ([Environment]::GetFolderPath('Desktop')) | Out-Null
          $readme = Get-Content readme\README.md -Raw
          $cmd = [regex]::Match($readme, '(?s)```powershell\r?\n(.*?)\r?\n```').Groups[1].Value
          if (-not $cmd) { throw 'No PowerShell command found in README.md' }
          Write-Host $cmd
          $env:XBP_DOWNLOAD_ONLY = '1'
          $out = Invoke-Expression $cmd *>&1 | Out-String; Write-Host $out
          if ($out -notmatch 'Downloaded and checked') { throw 'The download path did not finish' }
          Remove-Item Env:XBP_DOWNLOAD_ONLY
          $env:XBP_BUILD = '1'
          Invoke-Expression $cmd
          if (-not (Get-ChildItem ([Environment]::GetFolderPath('Desktop')) -Filter 'xbloom-panel-*-UPDATE-WiFi-or-USB.bin' -ErrorAction SilentlyContinue)) {
            throw 'The installer did not produce the update file'
          }
          Write-Host 'Windows installer: built the update file' -ForegroundColor Green

  mac:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      XBP_BUILD_ONLY: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          path: readme
          sparse-checkout: README.md
      - name: Run the README's Mac command
        run: |
          mkdir -p ~/Desktop
          cmd=$(awk '/^```bash$/{f=1;next} /^```$/{if(f)exit} f' readme/README.md | head -1)
          [ -n "$cmd" ] || { echo "No Mac command in README.md"; exit 1; }
          echo "$cmd"
          XBP_DOWNLOAD_ONLY=1 bash -c "$cmd" | tee /tmp/dl.txt
          grep -q 'Downloaded and checked' /tmp/dl.txt
          XBP_BUILD=1 bash -c "$cmd"
          ls ~/Desktop/xbloom-panel-*-UPDATE-WiFi-or-USB.bin
