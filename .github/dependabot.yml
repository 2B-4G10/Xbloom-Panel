# Dependabot keeps the build tools and the GitHub Actions used by the workflows up to date.
# Its pull requests are built by build-release.yml as a check (no release until merged).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(actions)"

  - package-ecosystem: pip
    directory: /           # requirements-build.txt (pioarduino core)
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(build)"
