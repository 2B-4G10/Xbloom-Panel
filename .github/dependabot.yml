# Dependabot keeps the build tools and the GitHub Actions used by the workflows up to date.
# Its pull requests are built by build-release.yml as a check (no release until merged).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(actions)"

  - package-ecosystem: pip
    directory: /           # requirements-build.txt (pioarduino core)
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(build)"
    ignore:
      # pioarduino must match the ESP32 platform's SCons (see requirements-build.txt);
      # 6.2.x needs a newer platform than the one pinned in platformio.ini.
      - dependency-name: pioarduino
        versions: [">=6.2"]
