# Builds the firmware and puts the release files in dist/. Shared by the release,
# essentials workflows so they build the same way.
name: Build firmware
description: Build the xBloom Panel firmware with the pioarduino core and collect the .bin files

inputs:
  environment:
    description: PlatformIO environment to build (emulator = the QEMU test build)
    default: crowpanel-advance-43

outputs:
  version:
    description: FW_VERSION from platformio.ini
    value: ${{ steps.collect.outputs.version }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"   # the ESP32 tools support 3.10–3.14
        cache: pip
        cache-dependency-path: requirements-build.txt

    - name: Cache PlatformIO packages
      uses: actions/cache@v6
      with:
        path: ~/.platformio
        key: pio-v2-${{ runner.os }}-py312-${{ hashFiles('platformio.ini', 'requirements-build.txt', 'requirements-build-overrides.txt') }}
        restore-keys: pio-v2-${{ runner.os }}-py312-

    # The ESP32 platform runs a nested build with the PlatformIO Core in ~/.platformio/penv
    # (the pioarduino fork). Install that same core there and use it for the whole build,
    # so both halves share one SCons.
    - name: Install build tools
      shell: bash
      run: |
        python -m venv ~/.platformio/penv
        ~/.platformio/penv/bin/python -m pip install -q --upgrade pip
        ~/.platformio/penv/bin/python -m pip uninstall -y -q platformio || true
        # --upgrade: a cached environment still gets the newest allowed versions (security fixes).
        ~/.platformio/penv/bin/python -m pip install -q --upgrade --upgrade-strategy eager -r requirements-build.txt
        # Security fixes pioarduino's own pins hold back (see that file). pip notes the
        # version conflict; it is expected.
        ~/.platformio/penv/bin/python -m pip install -q --upgrade -r requirements-build-overrides.txt 2>&1 | grep -v "dependency conflicts\|requires starlette\|resolver does not currently" || true
        ~/.platformio/penv/bin/pio --version

    # Known vulnerabilities in the build tools (they run on the build machine, not on the panel).
    - name: Check the build tools for known vulnerabilities
      shell: bash
      run: |
        ~/.platformio/penv/bin/python -m pip install -q pip-audit
        if ! ~/.platformio/penv/bin/pip-audit -l --progress-spinner off; then
          echo "::warning::A build tool has a known vulnerability (see the list above). Update requirements-build.txt or requirements-build-overrides.txt."
        fi

    # The highlights the panel shows once after updating, from the pending release notes.
    - name: What's new
      shell: bash
      run: python3 tools/make_whats_new.py

    - name: Build
      shell: bash
      env:
        PIO_ENV: ${{ inputs.environment }}
        # The release's build number (the N in v4.1.3-ds.N): the panel compares it with
        # the latest release on GitHub to offer updates.
        PLATFORMIO_BUILD_FLAGS: -DFW_BUILD=${{ github.run_number }}
      run: ~/.platformio/penv/bin/pio run -e "$PIO_ENV"

    # The ESP32-S3 crashes (LoadStoreError) on 8/16-bit reads from its code area.
    - name: Check for narrow reads from the code area
      shell: bash
      env:
        PIO_ENV: ${{ inputs.environment }}
      run: python3 tools/check_code_loads.py ".pio/build/$PIO_ENV/firmware.elf" "$(ls ~/.platformio/packages/toolchain-xtensa-esp-elf/bin/xtensa-esp32s3-elf-objdump)"

    - name: Collect the firmware files
      id: collect
      shell: bash
      env:
        PIO_ENV: ${{ inputs.environment }}
      run: |
        VER=$(sed -n "s/.*FW_VERSION='\"\([^\"]*\)\"'.*/\1/p" platformio.ini)
        B=.pio/build/$PIO_ENV
        rm -rf dist && mkdir dist
        # Names say how each file may be installed, to avoid mix-ups:
        cp "$B/firmware.bin"         dist/xbloom-panel-doubleshot-UPDATE-WiFi-or-USB.bin  # Wi-Fi update page (or USB at 0x10000)
        cp "$B/firmware.factory.bin" dist/xbloom-panel-doubleshot-FULL-USB-ONLY.bin       # USB only, at 0x0
        (cd dist && sha256sum ./*.bin | sed "s#\./##" > SHA256SUMS.txt && cat SHA256SUMS.txt)
        echo "version=${VER:-dev}" >> "$GITHUB_OUTPUT"
